services:
  - type: web
    name: study-kit-tracker
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AUTHORIZED_SIGNUP_EMAILS
        sync: false
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_COOKIES
        value: "True"
      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: "True"
      - key: DATABASE_URL
        sync: false
